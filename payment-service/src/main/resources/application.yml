server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Fraction of payments that fail their simulated processing check,
# independent of any deliberate test flag on the request itself.
# Exists so retry/backoff behaviour is demonstrable without needing
# a real, unreliable external payment gateway.
payment:
  simulated-failure-rate: ${PAYMENT_SIMULATED_FAILURE_RATE:0.15}
