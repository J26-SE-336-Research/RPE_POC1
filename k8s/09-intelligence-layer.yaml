apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-layer
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligence-layer
  template:
    metadata:
      labels:
        app: intelligence-layer
      # Sidecar webhook opt-out: this service observes the request chain,
      # it is not part of it. Under PROXY_ROLE=service the sidecar rejects
      # any request without a Request_id with HTTP 400, which would break
      # its calls to Prometheus/Tempo and anyone loading its dashboard.
      annotations:
        sidecar-injector.rrpe.io/inject: "false"
    spec:
      containers:
        - name: intelligence-layer
          image: rrpe/intelligence-layer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: SERVER_PORT
              value: "8090"
            # Prometheus and Tempo are NOT in k8s/ yet. These point at the
            # intended service names; the pod will start fine without them
            # but the dashboard will show empty data until they exist.
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: TEMPO_URL
              value: "http://tempo:3200"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: intelligence-layer
  namespace: rrpe-ecommerce
spec:
  selector:
    app: intelligence-layer
  ports:
    - port: 8090
      targetPort: 8090