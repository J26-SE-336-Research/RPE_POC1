apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # No initContainer here — notification-service keeps its log in
      # memory and has no database dependency, so there is nothing to
      # wait for before it can start.
      containers:
        - name: notification-service
          image: rrpe/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: rrpe-ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
