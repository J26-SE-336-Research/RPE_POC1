apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: postgres-credentials
      containers:
        - name: order-service
          image: rrpe/order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(ORDER_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: ORDER_DB
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: ORDER_DB
            # These three are why order-service doesn't need an
            # initContainer for them, only for postgres: a failed
            # RestTemplate call at runtime is not a startup failure —
            # Spring Boot starts fine even if these are briefly
            # unreachable, unlike a failed DB connection.
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: INVENTORY_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: PAYMENT_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: NOTIFICATION_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: rrpe-ecommerce
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
