apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      # ===============================================================
      # INIT CONTAINERS
      # ===============================================================
      initContainers:

        # -------------------------------------------------------------
        # Wait for PostgreSQL before starting the application.
        # -------------------------------------------------------------
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: postgres-credentials

        # -------------------------------------------------------------
        # Configure transparent proxy interception.
        # -------------------------------------------------------------
        - name: tproxy-init
          image: nicolaka/netshoot

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              add:
                - NET_ADMIN

          command:
            - sh
            - -c
            - |
              set -e

              # =======================================================
              # POLICY ROUTING FOR TPROXY
              # =======================================================

              ip rule add fwmark 1/1 table 100 2>/dev/null || true
              ip route add local 0.0.0.0/0 dev lo table 100 2>/dev/null || true

              # =======================================================
              # INBOUND TRAFFIC
              #
              # Incoming traffic to inventory-service:8082
              # is transparently redirected to the Netty sidecar
              # listening on port 15001.
              # =======================================================

              iptables -t mangle -N RRPE_TPROXY_IN 2>/dev/null || true
              iptables -t mangle -F RRPE_TPROXY_IN

              iptables -t mangle -C PREROUTING -p tcp \
                -j RRPE_TPROXY_IN 2>/dev/null || \
                iptables -t mangle -A PREROUTING -p tcp \
                -j RRPE_TPROXY_IN

              # Do not intercept traffic coming from the Minikube node.
              iptables -t mangle -A RRPE_TPROXY_IN \
                -s 192.168.49.0/24 \
                -j RETURN

              # Do not intercept loopback traffic.
              iptables -t mangle -A RRPE_TPROXY_IN \
                -d 127.0.0.0/8 \
                -j RETURN

              # Do not intercept traffic already destined for
              # the Netty sidecar.
              iptables -t mangle -A RRPE_TPROXY_IN \
                -p tcp \
                --dport 15001 \
                -j RETURN

              # -------------------------------------------------------
              # Inventory application port -> Netty sidecar
              # -------------------------------------------------------
              iptables -t mangle -A RRPE_TPROXY_IN \
                -p tcp \
                --dport 8082 \
                -j TPROXY \
                --on-port 15001 \
                --tproxy-mark 1/1

              # =======================================================
              # OUTBOUND TRAFFIC
              #
              # Intercept HTTP calls from Inventory Service to:
              #   Order        :8081
              #   Payment      :8083
              #   Notification :8084
              #
              # PostgreSQL :5432 is intentionally NOT intercepted.
              # =======================================================

              iptables -t mangle -N RRPE_TPROXY_OUT 2>/dev/null || true
              iptables -t mangle -F RRPE_TPROXY_OUT

              iptables -t mangle -C OUTPUT -p tcp \
                -j RRPE_TPROXY_OUT 2>/dev/null || \
                iptables -t mangle -A OUTPUT -p tcp \
                -j RRPE_TPROXY_OUT

              # Sidecar runs as UID 0.
              # Never intercept traffic generated by the sidecar itself.
              iptables -t mangle -A RRPE_TPROXY_OUT \
                -m owner \
                --uid-owner 0 \
                -j RETURN

              # Do not intercept loopback traffic.
              iptables -t mangle -A RRPE_TPROXY_OUT \
                -d 127.0.0.0/8 \
                -j RETURN

              # Do not intercept traffic destined for the sidecar itself.
              iptables -t mangle -A RRPE_TPROXY_OUT \
                -p tcp \
                --dport 15001 \
                -j RETURN

              # -------------------------------------------------------
              # Intercept calls to other HTTP services.
              # PostgreSQL :5432 is intentionally excluded.
              # -------------------------------------------------------
              iptables -t mangle -A RRPE_TPROXY_OUT \
                -p tcp \
                -m multiport \
                --dports 8081,8083,8084 \
                -j MARK \
                --set-mark 1

      # ===============================================================
      # APPLICATION CONTAINERS
      # ===============================================================
      containers:

        # -------------------------------------------------------------
        # INVENTORY APPLICATION
        # -------------------------------------------------------------
        - name: inventory-service
          image: rrpe/inventory-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8082
            - containerPort: 8086

          env:

            # Main Spring Boot application port.
            - name: SERVER_PORT
              value: "8082"

            # Separate management/Actuator port.
            # This port is NOT intercepted by TPROXY.
            - name: MANAGEMENT_SERVER_PORT
              value: "8086"

            # PostgreSQL connection.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/inventorydb

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD

            # Inventory database name from ConfigMap.
            - name: INVENTORY_DB
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: INVENTORY_DB

          # -----------------------------------------------------------
          # STARTUP PROBE
          # -----------------------------------------------------------
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            failureThreshold: 30
            periodSeconds: 5

          # -----------------------------------------------------------
          # LIVENESS PROBE
          # -----------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 15
            failureThreshold: 3

          # -----------------------------------------------------------
          # READINESS PROBE
          # -----------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3

        # -------------------------------------------------------------
        # NETTY TPROXY SIDECAR
        # -------------------------------------------------------------
        - name: sidecar-proxy
          image: rrpe/sidecar-proxy:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 15001

          env:

            # Netty listener.
            - name: PROXY_LISTEN_HOST
              value: "0.0.0.0"

            - name: PROXY_LISTEN_PORT
              value: "15001"

            # Default deadline used when this service-side proxy
            # does not receive a propagated deadline.
            - name: DEFAULT_DEADLINE_MILLIS
              value: "5000"

            # Service sidecars detect inbound deadline expiration.
            - name: PROXY_DETECT_INBOUND_DEADLINE
              value: "true"

            # This is a service sidecar, not the gateway sidecar.
            - name: PROXY_ROLE
              value: "service"

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: rrpe-ecommerce
spec:
  selector:
    app: inventory-service

  ports:
    - port: 8082
      targetPort: 8082