apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      # Kubernetes has no native "depends_on: condition: service_healthy"
      # the way docker-compose did. Without this initContainer, the app
      # container would start, fail its first DB connection, and
      # CrashLoopBackOff until Postgres happened to become ready —
      # noisy and slow. This waits up front instead.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: postgres-credentials
      containers:
        - name: inventory-service
          image: rrpe/inventory-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/inventorydb
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: INVENTORY_DB
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: INVENTORY_DB
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: rrpe-ecommerce
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
      targetPort: 8082
