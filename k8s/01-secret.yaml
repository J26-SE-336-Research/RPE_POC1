# Kubernetes Secrets are base64-encoded, not encrypted, unless you
# additionally enable encryption-at-rest on the cluster (Minikube
# does not by default). This is still the correct native object to
# use instead of a plain ConfigMap for credentials — it keeps secret
# values out of `kubectl describe`/logs by default — but don't treat
# it as "encrypted" without checking that separately.
#
# stringData lets you write plain text here; Kubernetes base64-encodes
# it for you on apply, so you never have to hand-encode anything.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: rrpe-ecommerce
type: Opaque
stringData:
  POSTGRES_USER: rrpe_admin
  POSTGRES_PASSWORD: change_this_password
