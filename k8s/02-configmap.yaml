apiVersion: v1
kind: ConfigMap
metadata:
  name: rrpe-config
  namespace: rrpe-ecommerce
data:
  ORDER_DB: orderdb
  INVENTORY_DB: inventorydb
  PAYMENT_DB: paymentdb
  PAYMENT_SIMULATED_FAILURE_RATE: "0.15"

  # Same values as docker-compose used — a Kubernetes Service named
  # "inventory-service" resolves via cluster DNS exactly the way the
  # docker-compose service name did. No application code changes.
  INVENTORY_SERVICE_URL: http://inventory-service:8082
  PAYMENT_SERVICE_URL: http://payment-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
  ORDER_SERVICE_URL: http://order-service:8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: rrpe-ecommerce
data:
  init-databases.sql: |
    CREATE DATABASE orderdb;
    CREATE DATABASE inventorydb;
    CREATE DATABASE paymentdb;
