apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "gateway"
        resilience.rrpe.dev/inbound-ports: "8080"
        resilience.rrpe.dev/outbound-ports: "8081:8084"
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "15001"
        resilience.rrpe.dev/default-deadline-ms: "1000"
    spec:
      containers:
        - name: gateway
          image: rameshkalhara/rrpe-api-gateway:contabo-20261013
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: ORDER_SERVICE_URL
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: INVENTORY_SERVICE_URL
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: PAYMENT_SERVICE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: NOTIFICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: rrpe-ecommerce
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
