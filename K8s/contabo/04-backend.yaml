apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
      annotations:
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "service"
        resilience.rrpe.dev/inbound-ports: "8084"
        resilience.rrpe.dev/outbound-ports: ""
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "8080"
    spec:
      containers:
        - name: notification
          image: rameshkalhara/rrpe-notification-service:contabo-20261013
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: rrpe-ecommerce
spec:
  selector:
    app: notification
  ports:
    - port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: rrpe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
      annotations:
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "service"
        resilience.rrpe.dev/inbound-ports: "8082"
        resilience.rrpe.dev/outbound-ports: ""
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "8080"
    spec:
      containers:
        - name: inventory
          image: rameshkalhara/rrpe-inventory-service:contabo-20261013
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: rrpe-config
                  key: SPRING_DATASOURCE_URL_INVENTORY
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: rrpe-ecommerce
spec:
  selector:
    app: inventory
  ports:
    - port: 8082
      targetPort: 8082
---
