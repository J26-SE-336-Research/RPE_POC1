apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
spec:
  template:
    metadata:
      annotations:
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "service"
    spec:
      initContainers:
        - name: configure-proxy-routing
          $patch: delete
      containers:
        - name: netty-proxy
          $patch: delete
