apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      initContainers:
        - name: configure-proxy-routing
          image: 2002rusira/netty-sidecar-proxy-rpe-implementation:v5
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              APP_PORT=8080
              PROXY_PORT=15001
              iptables -t mangle -N SIDECAR_TPROXY 2>/dev/null || true
              iptables -t mangle -F SIDECAR_TPROXY
              iptables -t mangle -A SIDECAR_TPROXY -i lo -j RETURN
              iptables -t mangle -A SIDECAR_TPROXY -p tcp --dport "$APP_PORT" -j TPROXY --on-port "$PROXY_PORT" --tproxy-mark 0x1/0x1
              iptables -t mangle -C PREROUTING -j SIDECAR_TPROXY 2>/dev/null || iptables -t mangle -I PREROUTING 1 -j SIDECAR_TPROXY
              ip rule add fwmark 0x1/0x1 lookup 100 2>/dev/null || true
              ip route replace local 0.0.0.0/0 dev lo table 100
              iptables -t nat -N SIDECAR_EGRESS 2>/dev/null || true
              iptables -t nat -F SIDECAR_EGRESS
              iptables -t nat -A SIDECAR_EGRESS -m owner --uid-owner 0 -j RETURN
              iptables -t nat -A SIDECAR_EGRESS -p tcp --dport 8081:8084 -j REDIRECT --to-ports "$PROXY_PORT"
              iptables -t nat -C OUTPUT -j SIDECAR_EGRESS 2>/dev/null || iptables -t nat -I OUTPUT 1 -j SIDECAR_EGRESS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
      containers:
        - name: apigateway
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          image: 2002rusira/api-gateway-rpe-implementation:v1
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: ORDER_SERVICE_URL

            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: INVENTORY_SERVICE_URL

            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: PAYMENT_SERVICE_URL

            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: NOTIFICATION_SERVICE_URL
        - name: netty-proxy
          image: 2002rusira/netty-sidecar-proxy-rpe-implementation:v5
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 15001
          env:
            - name: PROXY_ROLE
              value: gateway
            - name: PROXY_LISTEN_HOST
              value: 0.0.0.0
            - name: PROXY_LISTEN_PORT
              value: "15001"
            - name: DEFAULT_DEADLINE_MILLIS
              value: "1000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: apigateway
