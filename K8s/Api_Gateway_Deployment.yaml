apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-deployment
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      annotations:
        resilience.rrpe.dev/inbound-ports: "8080"
        resilience.rrpe.dev/outbound-ports: "8081:8084"
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "15001"
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "gateway"
        resilience.rrpe.dev/default-deadline-ms: "1000"
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          image: 2002rusira/api-gateway-rpe-implementation:v1
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: ORDER_SERVICE_URL

            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: INVENTORY_SERVICE_URL

            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: PAYMENT_SERVICE_URL

            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: NOTIFICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  selector:
    app: apigateway
