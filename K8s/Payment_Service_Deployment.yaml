apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      annotations:
        resilience.rrpe.dev/inbound-ports: "8083"
        resilience.rrpe.dev/outbound-ports: ""
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "8080"
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "service"
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          image: 2002rusira/payment-service-rpe-implementation:v1
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: SPRING_DATASOURCE_URL_payment

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rpe-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpe-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: payment
