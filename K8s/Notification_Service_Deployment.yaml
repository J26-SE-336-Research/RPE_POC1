apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-deployment
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      annotations:
        resilience.rrpe.dev/inbound-ports: "8084"
        resilience.rrpe.dev/outbound-ports: ""
        resilience.rrpe.dev/excluded-outbound-ports: ""
        resilience.rrpe.dev/proxy-port: "8080"
        resilience.rrpe.dev/inject: "enabled"
        resilience.rrpe.dev/role: "service"
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          image: 2002rusira/notification-service-rpe-implementation:v1
          ports:
            - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: notification
