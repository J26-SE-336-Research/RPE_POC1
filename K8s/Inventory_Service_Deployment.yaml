apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      initContainers:
        - name: configure-proxy-routing
          image: 2002rusira/netty-sidecar-proxy-rpe-implementation:v6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              APP_PORT=8082
              PROXY_PORT=8080
              iptables -t mangle -N SIDECAR_TPROXY 2>/dev/null || true
              iptables -t mangle -F SIDECAR_TPROXY
              iptables -t mangle -A SIDECAR_TPROXY -i lo -j RETURN
              iptables -t mangle -A SIDECAR_TPROXY -p tcp --dport "$APP_PORT" -j TPROXY --on-port "$PROXY_PORT" --tproxy-mark 0x1/0x1
              iptables -t mangle -C PREROUTING -j SIDECAR_TPROXY 2>/dev/null || iptables -t mangle -I PREROUTING 1 -j SIDECAR_TPROXY
              ip rule add fwmark 0x1/0x1 lookup 100 2>/dev/null || true
              ip route replace local 0.0.0.0/0 dev lo table 100
              iptables -t nat -N SIDECAR_EGRESS 2>/dev/null || true
              iptables -t nat -F SIDECAR_EGRESS
              iptables -t nat -A SIDECAR_EGRESS -m owner --uid-owner 0 -j RETURN
              iptables -t nat -A SIDECAR_EGRESS -p tcp --dport 8081:8084 -j REDIRECT --to-ports "$PROXY_PORT"
              iptables -t nat -C OUTPUT -j SIDECAR_EGRESS 2>/dev/null || iptables -t nat -I OUTPUT 1 -j SIDECAR_EGRESS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
      containers:
        - name: inventory
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          image: 2002rusira/inventory-service-rpe-implementation:v1
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: rpe-config
                  key: SPRING_DATASOURCE_URL_Inventory

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rpe-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpe-secret
                  key: POSTGRES_PASSWORD
        - name: netty-proxy
          image: 2002rusira/netty-sidecar-proxy-rpe-implementation:v6
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8080
          env:
            - name: PROXY_ROLE
              value: service
            - name: PROXY_LISTEN_HOST
              value: 0.0.0.0
            - name: PROXY_LISTEN_PORT
              value: "8080"
            - name: PROXY_DETECT_INBOUND_DEADLINE
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: inventory
